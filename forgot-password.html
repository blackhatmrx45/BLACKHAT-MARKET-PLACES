<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · BHODT AI</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/jpeg" href="/src/assets/images/bhodt_black_hat_logo_1790928314687.jpg">
</head>
<body>
  <div class="cyber-bg">
    <div class="glow-orb-blue"></div>
    <div class="glow-orb-red"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="auth-header">
    <a href="/" class="brand-lockup">
      <img src="/src/assets/images/bhodt_black_hat_logo_1790928314687.jpg" alt="BHODT Logo" class="brand-logo">
      <span class="brand-text">BHODT AI</span>
    </a>
    <a href="/login.html" class="back-link">
      ← Return to Login
    </a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="card-title">Forgot Password</h1>
      <p class="card-subtitle">Enter your registered email address to receive a secure password recovery token.</p>

      <div id="alert-box" class="alert-box"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Account Email</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="e.g. dev@company.com"
            required
          >
        </div>

        <button type="submit" id="btn-submit" class="btn-primary">
          <span id="btn-text">Generate Recovery Link</span>
        </button>
      </form>

      <div id="demo-token-box" style="display:none;margin-top:20px;padding:16px;background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.3);border-radius:12px;font-size:12px;">
        <strong style="color:#00E5FF;">Demo Recovery Link Ready:</strong>
        <p style="margin:6px 0;color:#cbd5e1;">Click below to reset your password immediately:</p>
        <a id="demo-link" href="#" style="color:#00FF66;font-weight:bold;word-break:break-all;"></a>
      </div>

      <div class="auth-footer">
        Remember your password? <a href="/login.html" class="auth-link">Log in</a>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const demoBox = document.getElementById('demo-token-box');
    const demoLink = document.getElementById('demo-link');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      btnSubmit.disabled = true;
      btnText.textContent = 'Processing...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        const data = await res.json();
        alertBox.textContent = data.message;
        alertBox.className = 'alert-box success';
        alertBox.style.display = 'block';

        if (data.resetUrl) {
          demoBox.style.display = 'block';
          demoLink.href = data.resetUrl;
          demoLink.textContent = window.location.origin + data.resetUrl;
        }
      } catch (err) {
        alertBox.textContent = 'Failed to request reset token.';
        alertBox.className = 'alert-box error';
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnText.textContent = 'Generate Recovery Link';
      }
    });
  </script>
</body>
</html>
