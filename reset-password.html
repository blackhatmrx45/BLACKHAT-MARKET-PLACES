<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password · BHODT AI</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/jpeg" href="/src/assets/images/bhodt_black_hat_logo_1790928314687.jpg">
</head>
<body>
  <div class="cyber-bg">
    <div class="glow-orb-blue"></div>
    <div class="glow-orb-red"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="auth-header">
    <a href="/" class="brand-lockup">
      <img src="/src/assets/images/bhodt_black_hat_logo_1790928314687.jpg" alt="BHODT Logo" class="brand-logo">
      <span class="brand-text">BHODT AI</span>
    </a>
    <a href="/login.html" class="back-link">
      ← Return to Login
    </a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="card-title">Set New Password</h1>
      <p class="card-subtitle">Choose a new, secure password for your BHODT account.</p>

      <div id="alert-box" class="alert-box"></div>

      <form id="reset-form">
        <input type="hidden" id="reset-token">

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input
            type="password"
            id="new_password"
            class="form-input"
            placeholder="At least 8 characters"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <input
            type="password"
            id="confirm_password"
            class="form-input"
            placeholder="Re-enter new password"
            required
          >
        </div>

        <button type="submit" id="btn-submit" class="btn-primary">
          <span id="btn-text">Update Password</span>
        </button>
      </form>

      <div class="auth-footer">
        Back to <a href="/login.html" class="auth-link">Login</a>
      </div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const tokenInput = document.getElementById('reset-token');
    const alertBox = document.getElementById('alert-box');
    const form = document.getElementById('reset-form');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');

    if (!token) {
      alertBox.textContent = 'Invalid or missing reset token. Please request a new link from the forgot password page.';
      alertBox.className = 'alert-box error';
      alertBox.style.display = 'block';
      form.style.display = 'none';
    } else {
      tokenInput.value = token;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const new_password = document.getElementById('new_password').value;
      const confirm_password = document.getElementById('confirm_password').value;

      if (new_password !== confirm_password) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.className = 'alert-box error';
        alertBox.style.display = 'block';
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'Updating...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password, confirm_password }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to reset password');

        alertBox.textContent = data.message;
        alertBox.className = 'alert-box success';
        alertBox.style.display = 'block';
        form.reset();

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.className = 'alert-box error';
        alertBox.style.display = 'block';
        btnSubmit.disabled = false;
        btnText.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
