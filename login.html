<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · BHODT AI</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/jpeg" href="/src/assets/images/bhodt_black_hat_logo_1790928314687.jpg">
</head>
<body>
  <!-- Cyber Ambient Lighting Background -->
  <div class="cyber-bg">
    <div class="glow-orb-blue"></div>
    <div class="glow-orb-red"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Header Lockup -->
  <header class="auth-header">
    <a href="/" class="brand-lockup">
      <img src="/src/assets/images/bhodt_black_hat_logo_1790928314687.jpg" alt="BHODT Logo" class="brand-logo">
      <span class="brand-text">BHODT AI</span>
    </a>
    <a href="/" class="back-link">
      ← Back to Marketplace
    </a>
  </header>

  <!-- Login Card -->
  <main class="auth-container">
    <div class="auth-card">
      <h1 class="card-title">Welcome Back</h1>
      <p class="card-subtitle">Log in to access your BHODT AI dashboard, saved tools, and conversations.</p>

      <div id="alert-box" class="alert-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="identifier">Email or Username</label>
          <div class="input-wrap">
            <input
              type="text"
              id="identifier"
              class="form-input"
              placeholder="e.g. admin@bhodt.dev or username"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" id="toggle-pwd" class="toggle-pwd">Show</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <a href="/forgot-password.html" class="auth-link">Forgot password?</a>
        </div>

        <button type="submit" id="btn-submit" class="btn-primary">
          <span id="btn-text">Log In</span>
        </button>
      </form>

      <!-- Prepared 3P Google OAuth Architecture -->
      <div class="social-divider">
        <span>Or continue with</span>
      </div>

      <button type="button" class="btn-google" onclick="alert('Google Workspace OAuth architecture is initialized. Configure CLIENT_ID in .env to enable instant Google sign-in.')">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google Account</span>
      </button>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html" class="auth-link">Create one now</a>
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    // Password toggle
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.textContent = isPwd ? 'Hide' : 'Show';
    });

    // Handle Form Submit
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = `alert-box ${isSuccess ? 'success' : 'error'}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const identifier = document.getElementById('identifier').value.trim();
      const password = pwdInput.value;
      const remember_me = document.getElementById('remember-me').checked;

      btnSubmit.disabled = true;
      btnText.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, remember_me }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed.');
        }

        showAlert('Login successful! Redirecting...', true);
        window.BhodtAuth.setToken(data.token);
        window.BhodtAuth.setUser(data.user);

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        }, 800);
      } catch (err) {
        showAlert(err.message);
        btnSubmit.disabled = false;
        btnText.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
